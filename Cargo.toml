[package]
name = "ollama-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Terminal dashboard for a local Ollama: a transparent proxy that records each request's tokens, TTFT and throughput, prices them at frontier-API rates, and shows Apple Silicon hardware telemetry."
license = "MIT"
repository = "https://github.com/Ward-Software-Defined-Systems/Ollama-Monitor"

[[bin]]
name = "ollama-monitor"
path = "src/main.rs"

[dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# HTTP — reverse proxy
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "macros"] }
bytes = "1"
futures-util = "0.3"
tokio-stream = "0.1"

# HTTP client (poller + proxy upstream)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }

# TUI
ratatui = "0.30"
crossterm = "0.29"

# storage
rusqlite = { version = "0.32", features = ["bundled"] }

# system
sysinfo = "0.38" # match LMS-Monitor: 0.32's available_memory() saturates to 0 under heavy compression
libc = "0.2"

# serde / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# error / utilities
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
